name: Update odds and deploy site

on:
  # Every 2 hours at :17 UTC (12:17 AM, 2:17 AM, ... Central): game lines + props on every run.
  # Every run also refreshes season-long markets from Kalshi (free); sportsbook futures refresh about once a week (~4 credits).
  # Budget on the $30 plan (20,000 credits/month, resets on the 7th, the day we upgraded): ~4,300 for lines
  # (4 sports x 3 credits x 12 runs a day), ~20 for futures, and props get the rest. fetch-odds.mjs paces props
  # so the cycle never runs out. If you change the cron, change RUN_EVERY_HOURS / RUN_MINUTE / *_RUNS_PER_DAY below too.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:             # "Run workflow" button on the Actions tab
    inputs:
      mode:
        description: "What to refresh"
        type: choice
        options: [all, lines, props, futures]
        default: all
  push:
    branches: [main]             # redeploy the site when you change it (no credits spent)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: odds-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest odds
        if: github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'futures')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'all' }}
          # Optional overrides: Settings -> Secrets and variables -> Actions -> Variables
          SPORTS: ${{ vars.SPORTS }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS }}
          MARKETS: ${{ vars.MARKETS }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          # How many games per sport can get props. The credit budget decides how many are refreshed each run;
          # the stalest go first, so every game in the window gets fresh props every few hours.
          PROP_GAMES_NFL: ${{ vars.PROP_GAMES_NFL || '16' }}
          PROP_GAMES_NBA: ${{ vars.PROP_GAMES_NBA || '15' }}
          PROP_GAMES_NCAAF: ${{ vars.PROP_GAMES_NCAAF || '12' }}
          PROP_GAMES_NCAAB: ${{ vars.PROP_GAMES_NCAAB }}
          PROP_WINDOW_HOURS: ${{ vars.PROP_WINDOW_HOURS }}
          # Must match the cron above.
          LINES_EVERY_DAYS: ${{ vars.LINES_EVERY_DAYS || '1' }}
          LINES_RUNS_PER_DAY: ${{ vars.LINES_RUNS_PER_DAY || '12' }}
          PROPS_RUNS_PER_DAY: ${{ vars.PROPS_RUNS_PER_DAY || '12' }}
          RUN_EVERY_HOURS: '2'
          RUN_MINUTE: '17'
          QUOTA_RESET_DAY: ${{ vars.QUOTA_RESET_DAY || '7' }}
        run: node scripts/fetch-odds.mjs

      - name: Fetch season-long markets (futures, awards, win totals)
        if: github.event_name != 'push'
        continue-on-error: true          # never block the odds update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'all' }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS }}
        run: node scripts/fetch-futures.mjs

      - name: Check line-move alerts
        if: github.event_name != 'push'
        continue-on-error: true          # never block the odds update
        run: node scripts/check-alerts.mjs

      - name: Build price-gaps feed (docs/data/gaps.json, read by the Daily Poster agent)
        continue-on-error: true          # never block the odds update
        run: node scripts/build-gaps.mjs

      - name: Save odds snapshot to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          node -e "const fs=require('fs');const at=f=>{try{return JSON.parse(fs.readFileSync(f,'utf8')).generated_at||null}catch{return null}};fs.writeFileSync('docs/data/meta.json',JSON.stringify({odds_at:at('docs/data/odds.json'),futures_at:at('docs/data/futures.json')}))"
          git add docs/data/odds.json docs/data/meta.json
          if [ -f docs/data/futures.json ]; then git add docs/data/futures.json; fi
          if [ -f docs/data/gaps.json ]; then git add docs/data/gaps.json; fi
          git diff --cached --quiet || git commit -m "Update odds [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
